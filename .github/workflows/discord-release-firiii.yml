name: Discord oznam o novom release (FiriiiMods)

on:
  release:
    types: [published]   # reaguje len na releasy s tagom firiii-... (viď podmienka nižšie)
  # ručné spustenie: používa ho testovacie tlačidlo v admin paneli na webe
  workflow_dispatch:
    inputs:
      title:
        description: Názov releasu
        required: true
        default: FiriiiMods (test)
      body:
        description: Popis zmien
        required: false
        default: ""
      prerelease:
        description: Predbežná verzia
        required: false
        default: "false"

jobs:
  notify:
    # Releasy v repozitári sú spoločné: sem idú len tie s tagom začínajúcim na firiii-, ostatné patria TajiiiMods
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'firiii-')
    runs-on: ubuntu-latest
    steps:
      - name: Poslať správu na Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_FIRIII }}
          TEST: ${{ github.event_name == 'workflow_dispatch' }}
          TITLE: ${{ github.event.release.name || github.event.release.tag_name || inputs.title }}
          BODY: ${{ github.event.release.body || inputs.body }}
          PRERELEASE: ${{ github.event.release.prerelease || inputs.prerelease }}
          AUTHOR: ${{ github.event.release.author.login || github.actor }}
          AVATAR: ${{ github.event.release.author.avatar_url || format('https://github.com/{0}.png', github.actor) }}
          PUBLISHED: ${{ github.event.release.published_at }}
          SITE: https://tajiii8095.github.io/?brand=firiii
        run: |
          # pri teste nie je čas vydania z releasu, použije sa aktuálny
          PUBLISHED="${PUBLISHED:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"

          # Verzia je len na jednom mieste: v nadpise (názov releasu ju už obsahuje).
          # Nadpis aj pole "Stiahnutie" vedú na web, nie na GitHub a nie na priamy odkaz na súbor.
          jq -n \
            --arg title "$TITLE" \
            --arg site "$SITE" \
            --arg body "${BODY:0:1500}" \
            --arg pre "$PRERELEASE" \
            --arg test "$TEST" \
            --arg author "$AUTHOR" \
            --arg avatar "$AVATAR" \
            --arg published "$PUBLISHED" '
            {embeds: [{
                author: {name: (if $test == "true" then "🧪 TEST · Nový release" else "🆕 Nový release" end)},
                title: $title,
                url: $site,
                description: (if ($body | length) > 0 then $body else "_Bez popisu zmien._" end),
                color: (if $test == "true" then 9807270 elif $pre == "true" then 16096779 else 8141549 end),
                fields: [{name: "📦 Stiahnutie", value: ("**[" + ($site | sub("^https?://"; "") | rtrimstr("/")) + "](" + $site + ")**"), inline: false}],
                footer: ({text: ((if $test == "true" then "Testovací oznam  ·  " else "" end) + "Vydal " + $author + (if $pre == "true" then "  ·  predbežná verzia" else "" end))}
                         + (if ($avatar | length) > 0 then {icon_url: $avatar} else {} end)),
                timestamp: $published
              }]}' \
          | curl -sS -f -H "Content-Type: application/json" -d @- "$WEBHOOK"
