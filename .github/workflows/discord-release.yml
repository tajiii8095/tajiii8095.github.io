name: Discord oznam o novom release

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Poslať správu na Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ github.event.release.name || github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          AUTHOR: ${{ github.event.release.author.login }}
          AVATAR: ${{ github.event.release.author.avatar_url }}
          PUBLISHED: ${{ github.event.release.published_at }}
          SITE: https://tajiii8095.github.io/
        run: |
          # Verzia je len na jednom mieste: v nadpise (názov releasu ju už obsahuje).
          # Nadpis aj pole "Stiahnutie" vedú na web, nie na GitHub a nie na priamy odkaz na súbor.
          jq -n \
            --arg title "$TITLE" \
            --arg site "$SITE" \
            --arg body "${BODY:0:1500}" \
            --arg pre "$PRERELEASE" \
            --arg author "$AUTHOR" \
            --arg avatar "$AVATAR" \
            --arg published "$PUBLISHED" '
            {embeds: [{
                author: {name: "🆕 Nový release"},
                title: $title,
                url: $site,
                description: (if ($body | length) > 0 then $body else "_Bez popisu zmien._" end),
                color: (if $pre == "true" then 16096779 else 8141549 end),
                fields: [{name: "📦 Stiahnutie", value: ("**[" + ($site | sub("^https?://"; "") | rtrimstr("/")) + "](" + $site + ")**"), inline: false}],
                footer: ({text: ("Vydal " + $author + (if $pre == "true" then "  ·  predbežná verzia" else "" end))}
                         + (if ($avatar | length) > 0 then {icon_url: $avatar} else {} end)),
                timestamp: (if ($published | length) > 0 then $published else null end)
              }]}' \
          | curl -sS -f -H "Content-Type: application/json" -d @- "$WEBHOOK"
