<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TajiiiMods</title>
<style>
:root{--black:#0e0e12;--ink:#17171d;--purple:#7c3aed;--purple2:#a78bfa;--soft:#f5f3ff;--white:#fff;--muted:#6b6b7b;--line:#e7e4f3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:var(--white);color:var(--ink);line-height:1.55}
a{color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--black);color:#fff;border-bottom:1px solid #26262f}
.bar{max-width:1060px;margin:0 auto;padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.2rem;text-decoration:none;letter-spacing:.3px}
.logo span{color:var(--purple2)}
.lang{display:inline-flex;margin-left:1.3rem;border:1px solid #3a3a46;border-radius:8px;overflow:hidden;vertical-align:middle}
.lang button{background:none;border:0;color:#c9c9d6;padding:.3rem .7rem;cursor:pointer;font-size:.85rem;font-weight:600}
.lang button.on{background:var(--purple);color:#fff}
nav a{color:#c9c9d6;text-decoration:none;margin-left:1.3rem;font-size:.95rem}
nav a:hover{color:#fff}
.hero{background:radial-gradient(900px 300px at 80% -20%,#4c1d95 0%,transparent 70%),var(--black);color:#fff;padding:4rem 1.2rem 4.5rem;text-align:center}
.hero h1{margin:0;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-1px}
.hero h1 em{font-style:normal;color:var(--purple2)}
.hero p{max-width:560px;margin:1rem auto 1.8rem;color:#b9b9c8}
.cta{display:inline-block;background:var(--purple);color:#fff;text-decoration:none;padding:.7rem 1.6rem;border-radius:10px;font-weight:600}
.cta:hover{background:#6d28d9}
section{max-width:1060px;margin:0 auto;padding:3rem 1.2rem}
h2{margin:0 0 .3rem;font-size:1.8rem;letter-spacing:-.5px}
.sub{color:var(--muted);margin:0 0 1.5rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem}
.chips button{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:.45rem 1.1rem;border-radius:999px;cursor:pointer;font-size:.95rem;font-weight:500}
.chips button.active{background:var(--ink);color:#fff}
.gh{display:flex;align-items:center;gap:.6rem;margin:2rem 0 1rem;font-size:1.25rem;font-weight:700}
.gh::after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem}
.card{border:1.5px solid var(--line);border-radius:16px;padding:1.3rem;background:#fff;transition:.2s;display:flex;flex-direction:column}
.card:hover{border-color:var(--purple);box-shadow:0 8px 28px rgba(124,58,237,.14);transform:translateY(-2px)}
.card h3{margin:0 0 .5rem;font-size:1.15rem}
.tags{margin-bottom:.6rem}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:.15rem .65rem;border-radius:999px;background:var(--soft);color:var(--purple);margin:0 .3rem .3rem 0}
.tag.dark{background:var(--ink);color:#fff}
.card p{margin:0 0 1rem;color:var(--muted);font-size:.95rem;flex:1}
.btn{display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;padding:.6rem 1rem;border-radius:10px;font-weight:600;font-size:.95rem}
.btn:hover{background:var(--purple)}
details{margin-top:.9rem}
summary{cursor:pointer;font-weight:600;color:var(--purple);font-size:.92rem}
table{width:100%;border-collapse:collapse;margin-top:.6rem;font-size:.85rem}
th,td{text-align:left;padding:.4rem .2rem;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
td a{color:var(--purple);font-weight:600}
.about{background:var(--black);color:#fff}
.about .in{max-width:1060px;margin:0 auto;padding:3rem 1.2rem}
.about p{color:#b9b9c8;max-width:640px}

/* ---- karta: náhľad + detail ---- */
.thumb{display:block;margin:-1.3rem -1.3rem 1rem;border-radius:14px 14px 0 0;overflow:hidden;aspect-ratio:16/9;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .thumb img{transform:scale(1.04)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);margin-top:.55rem}
.btn.ghost:hover{background:var(--soft);color:var(--purple);border-color:var(--purple)}
#detail{display:none;max-width:1060px;margin:0 auto;padding:1.6rem 1.2rem 3rem}
body.detail-open #detail{display:block}
body.detail-open .hero,body.detail-open #mody,body.detail-open .about{display:none}
.back{display:inline-block;margin-bottom:1rem;color:var(--purple);font-weight:600;text-decoration:none}
.back:hover{text-decoration:underline}
.dhead{display:flex;gap:1.2rem;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:1.4rem}
.dhead h1{margin:0 0 .5rem;font-size:clamp(1.7rem,4.5vw,2.4rem);letter-spacing:-.5px}
.dhead .btn{padding:.75rem 1.6rem}
.dl-box{min-width:230px}
.dl-box details{margin-top:.6rem}
.sec-title{font-size:1.25rem;font-weight:700;margin:2rem 0 .8rem;display:flex;align-items:center;gap:.6rem}
.sec-title::after{content:"";flex:1;height:2px;background:var(--line)}
.gal-main{display:block;width:100%;padding:0;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:var(--soft);cursor:zoom-in;aspect-ratio:16/9}
.gal-main img{width:100%;height:100%;object-fit:contain;display:block;background:#0e0e12}
.gal-cap{color:var(--muted);font-size:.9rem;margin:.5rem .2rem 0;min-height:1.3em}
.gal-thumbs{display:flex;gap:.6rem;margin-top:.7rem;overflow-x:auto;padding-bottom:.4rem}
.gal-thumbs button{flex:0 0 auto;width:110px;aspect-ratio:16/10;padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#0e0e12;opacity:.75}
.gal-thumbs button.on{border-color:var(--purple);opacity:1}
.gal-thumbs button:hover{opacity:1}
.gal-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.md{overflow-wrap:anywhere}
.md h1{font-size:1.9rem;letter-spacing:-.5px;margin:1.6rem 0 .6rem}
.md h2{font-size:1.5rem;margin:2.2rem 0 .6rem;padding-bottom:.3rem;border-bottom:2px solid var(--line)}
.md h3{font-size:1.2rem;margin:1.6rem 0 .4rem}
.md h4{font-size:1.05rem;margin:1.2rem 0 .3rem}
.md p,.md li{color:#33333f}
.md li{margin:.25rem 0}
.md a{color:var(--purple);font-weight:600}
.md img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin:.4rem 0}
.md code{background:var(--soft);color:#5b21b6;padding:.1rem .4rem;border-radius:6px;font-size:.88em}
.md pre{background:var(--black);color:#e8e8f2;padding:1rem;border-radius:12px;overflow-x:auto}
.md pre code{background:none;color:inherit;padding:0}
.md blockquote{margin:1rem 0;padding:.6rem 1rem;border-left:4px solid var(--purple);background:var(--soft);border-radius:0 10px 10px 0}
.md blockquote p{margin:.3rem 0}
.md hr{border:0;height:2px;background:var(--line);margin:2rem 0}
.md .tw{overflow-x:auto;margin:.8rem 0}
.md table{font-size:.9rem;min-width:420px}
.md th,.md td{padding:.5rem .6rem;vertical-align:top}
.md th{background:var(--soft);color:var(--ink);font-weight:600}
.lb{position:fixed;inset:0;z-index:50;background:rgba(14,14,18,.94);display:none;align-items:center;justify-content:center;flex-direction:column;padding:1rem}
.lb.open{display:flex}
.lb img{max-width:96vw;max-height:80vh;object-fit:contain;border-radius:8px}
.lb .cap{color:#d8d8e6;margin-top:.8rem;text-align:center;max-width:90vw}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;width:46px;height:46px;font-size:1.5rem;cursor:pointer}
.lb button:hover{background:var(--purple)}
.lb .x{top:1rem;right:1rem}.lb .p{left:1rem;top:50%}.lb .n{right:1rem;top:50%}
.dc{margin:1rem 0 .6rem}.dcbtn{display:inline-block;padding:.7rem 1.6rem}.dcnick{margin:0}
/* ---- admin ---- */
#admin{display:none;max-width:720px;margin:0 auto;padding:1.6rem 1.2rem 3rem}
body.admin-open #admin{display:block}
body.admin-open .hero,body.admin-open #mody,body.admin-open .about,body.admin-open #detail{display:none}
#admin h1{margin:.2rem 0 1.2rem;font-size:clamp(1.6rem,4.5vw,2.2rem);letter-spacing:-.5px}
.acard{border:1.5px solid var(--line);border-radius:16px;padding:1.3rem;margin-bottom:1.2rem;background:#fff}
.acard h3{margin:0 0 .3rem;font-size:1.15rem}
.acard p{color:var(--muted);font-size:.92rem;margin:.2rem 0 1rem}
.acard label{display:block;font-weight:600;font-size:.9rem;margin:.9rem 0 .35rem}
.acard input[type=text],.acard input[type=password],.acard textarea{width:100%;font:inherit;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.acard input:focus,.acard textarea:focus{outline:0;border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.acard textarea{min-height:110px;resize:vertical}
.chk{display:flex;align-items:center;gap:.5rem;font-weight:500;margin:.9rem 0 0}
.chk input{width:1.05rem;height:1.05rem;accent-color:var(--purple)}
.arow{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1.1rem}
.abtn{border:0;cursor:pointer;font:inherit;font-weight:600;background:var(--purple);color:#fff;padding:.7rem 1.4rem;border-radius:10px}
.abtn:hover{background:#6d28d9}.abtn:disabled{opacity:.5;cursor:default}
.abtn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.abtn.ghost:hover{background:var(--soft);color:var(--purple);border-color:var(--purple)}
.who{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.who b{color:var(--purple)}
.astat{margin-top:1rem;padding:.7rem .9rem;border-radius:10px;font-size:.92rem;background:var(--soft);display:none;overflow-wrap:anywhere}
.astat.show{display:block}.astat.ok{background:#ecfdf3;color:#15603a}.astat.err{background:#fef0f0;color:#9b1c1c}
.anote{font-size:.82rem;color:var(--muted);margin-top:1rem}
.runs{width:100%;font-size:.9rem}.runs td{padding:.5rem .2rem}
.acard select{width:100%;font:inherit;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.acard input[readonly]{background:var(--soft)}
.acard textarea.tall{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}
.grow{display:grid;gap:.4rem;border:1.5px dashed var(--line);border-radius:10px;padding:.7rem;margin-bottom:.6rem}
.grow .abtn{justify-self:start;padding:.4rem .9rem}
.hint{font-size:.82rem;color:var(--muted);margin:.3rem 0 0}
.adm{text-decoration:none;opacity:.35;margin-left:.6rem}.adm:hover{opacity:1}
footer{background:var(--black);color:#8a8a9a;text-align:center;padding:1.5rem 1rem 2rem;font-size:.85rem;border-top:1px solid #26262f}
</style>
</head>

  <a class="logo" href="#top">Tajiii<span>Mods</span></a>

const verOf = n => (String(n).match(/(\d+(?:\.\d+)+)/)||[,"?"])[1];
const cmp = (a,b) => { const x=a.split(".").map(Number), y=b.split(".").map(Number);
  for (let i=0;i<Math.max(x.length,y.length);i++){ const d=(y[i]||0)-(x[i]||0); if(d) return d; } return 0; };

async function loadVersions(){
  for (const m of MODS) m.versions = [];
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`);
    if (!r.ok) throw 0;
    for (const rel of await r.json()){
      if (rel.draft) continue;
      for (const a of rel.assets||[]){
        const low = a.name.toLowerCase();
        for (const m of MODS) if (low.startsWith(m.prefix) && /\.(jar|zip)$/.test(low))
          m.versions.push({v:verOf(a.name), date:(rel.published_at||"").slice(0,10), note:rel.name||"", url:a.browser_download_url, dc:a.download_count||0});
      }
    }
  } catch(e){}
  for (const m of MODS){
    if (!m.versions.length) m.versions = (m.zaloha||[]).map(u=>({v:verOf(u), date:"", note:"", url:u}));
    m.versions.sort((a,b)=>cmp(a.v,b.v));
    m.downloads = m.versions.some(x=>x.dc!==undefined) ? m.versions.reduce((n,x)=>n+(x.dc||0),0) : null;
  }
}

const dlTag = m => m.downloads==null ? "" : `<span class="tag" title="${t("dlTotal")}">⬇ ${m.downloads.toLocaleString(lang==="sk"?"sk-SK":"en-US")}</span>`;

/* ---------- Markdown ---------- */
function mdToHtml(txt){
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(txt,{gfm:true}));
  return "<pre>"+esc(txt)+"</pre>";   // keď sa nenačíta knižnica (CDN), ukáže sa aspoň čistý text
}
function fixMd(box, base){
  box.querySelectorAll("h1,h2,h3,h4").forEach(h => { if(!h.id) h.id = "md-"+slug(h.textContent); });
  box.querySelectorAll("table").forEach(tb => { const w=document.createElement("div"); w.className="tw"; tb.replaceWith(w); w.appendChild(tb); });
  box.querySelectorAll("img").forEach(i => { const s=i.getAttribute("src")||"";
    if (s && !/^(https?:|data:|\/)/i.test(s)) i.src = new URL(s, base).href; i.loading="lazy"; });
  box.querySelectorAll("a[href]").forEach(a => { const h=a.getAttribute("href")||"";
    if (/^https?:/i.test(h)) { a.target="_blank"; a.rel="noopener noreferrer"; }
    else if (h.startsWith("#")) a.dataset.md = "md-"+slug(decodeURIComponent(h.slice(1)));
    else if (!/^(mailto:|\/)/i.test(h)) a.href = new URL(h, base).href; });
}
async function loadReadme(m){
  const box = document.getElementById("mdbox"); if (!box) return;
  const url = pick(m.readme);
  if (!url) { box.innerHTML = `<p class="sub">${t("noReadme")}</p>`; return; }
  const token = ++readmeToken;
  box.innerHTML = `<p class="sub">${t("load")}</p>`;
  try {
    const r = await fetch(url, {cache:"no-cache"}); if (!r.ok) throw new Error("HTTP "+r.status);
    let txt = await r.text();
    if (m.swapFabric) txt = txt.replace(/Fabric/g,"NeoForge").replace(/FABRIC/g,"NEOFORGE");
    if (token !== readmeToken) return;
    box.innerHTML = mdToHtml(txt);
    fixMd(box, new URL(url, location.href));
  } catch(e){ if (token === readmeToken) box.innerHTML = `<p class="sub">${t("readmeErr")}<br><small>${esc(url)} — ${esc(e && e.message || e)}</small></p>`; }
}

function galHtml(m){

function setGal(i){
  const g = curMod && curMod.gallery; if (!g || !g[i]) return;
  galIdx = i;

const lb = document.getElementById("lb");
function lbShow(i){
  const g = curMod && curMod.gallery; if (!g || !g.length) return;

}
function lbClose(){ lb.classList.remove("open"); if (curMod) setGal(galIdx); }
lb.addEventListener("click", e => {
  const a = e.target.closest("button"); 
  if (a) { const k=a.dataset.a; if(k==="close") lbClose(); else lbShow(galIdx + (k==="next"?1:-1)); }
  else if (e.target === lb) lbClose();
});
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key==="Escape") lbClose(); else if (e.key==="ArrowRight") lbShow(galIdx+1); else if (e.key==="ArrowLeft") lbShow(galIdx-1);
});

/* ---------- admin panel ----------
   Stránka je statická a verejná, takže heslo v HTML by nič nechránilo. Preto sa prihlasuje GitHub tokenom:
   bez neho sa nedá nič odoslať, a webhook zostáva v GitHub Secrets (nikdy v tomto súbore). Test posiela
   GitHub Actions workflow discord-release.yml cez workflow_dispatch. */
const ADMIN_USER = "tajiii8095";            // len tento GitHub účet sa dostane dnu
const WORKFLOW   = "discord-release.yml";   // súbor v .github/workflows/
const TKEY = "gh_admin_token";
const adm = { token:"", user:"", branch:"main", state:"out", msg:"" };   // state: out | checking | in | denied
try { adm.token = sessionStorage.getItem(TKEY) || localStorage.getItem(TKEY) || ""; } catch(e){}

const ghApi = (path, opt) => fetch("https://api.github.com"+path, Object.assign({}, opt, {
  headers: Object.assign({"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Authorization":"Bearer "+adm.token}, (opt&&opt.headers)||{})}));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $id = id => document.getElementById(id);

function clearToken(){ adm.token = ""; try { sessionStorage.removeItem(TKEY); localStorage.removeItem(TKEY); } catch(e){} }

async function verifyAdmin(){
  adm.state = "checking"; adm.msg = ""; drawAdmin();
  try {
    const u = await ghApi("/user");
    if (u.status === 401) throw new Error(t("admBadToken"));
    if (!u.ok) throw new Error("GitHub " + u.status);
    const me = await u.json();
    const r = await ghApi("/repos/" + REPO);
    if (!r.ok) throw new Error(t("admNoRepo"));
    const repo = await r.json();
    adm.user = me.login || "";
    if (adm.user.toLowerCase() !== ADMIN_USER.toLowerCase() || !(repo.permissions && repo.permissions.push)) {
      adm.state = "denied"; clearToken(); drawAdmin(); return;
    }
    adm.branch = repo.default_branch || "main";
    adm.state = "in";
  } catch(e){ adm.state = "out"; adm.msg = String((e && e.message) || e); clearToken(); }
  drawAdmin();
  if (adm.state === "in") { loadRuns(); loadAdminMods(); }
}

function drawAdmin(){
  const box = $id("admbody"); if (!box) return;
  if (adm.state === "checking") { box.innerHTML = `<div class="acard"><p style="margin:0">${t("admChecking")}</p></div>`; return; }
  if (adm.state === "in") {
    const v = MODS[0] && MODS[0].versions && MODS[0].versions[0];
    const defTitle = MODS[0] ? (MODS[0].name + (v ? " " + v.v : "")) : "";
    box.innerHTML =
      `<div class="acard who"><span>${t("admAs")} <b>${esc(adm.user)}</b></span><button class="abtn ghost" data-a="logout">${t("admSignOut")}</button></div>
       <div id="admmods"></div>
       <div class="acard"><h3>${t("admTestT")}</h3><p>${t("admTestP")}</p>
         <label for="admt">${t("admRelTitle")}</label><input type="text" id="admt" value="${esc(defTitle)}" maxlength="100">
         <label for="admb">${t("admRelBody")}</label><textarea id="admb" maxlength="1500"></textarea>
         <label class="chk"><input type="checkbox" id="admp"> ${t("admPre")}</label>
         <div class="arow"><button class="abtn" id="admsend" data-a="send">${t("admSend")}</button></div>
         <div class="astat" id="admstat"></div></div>
       <div class="acard"><h3>${t("admRuns")}</h3><div id="admruns"></div>
         <div class="arow"><button class="abtn ghost" data-a="runs">${t("admRefresh")}</button></div></div>
       <p class="anote">${t("admNote")}</p>`;
    if (adm.mods) drawMods();
    return;
  }
  const err = adm.state === "denied" ? t("admDenied") : adm.msg;
  box.innerHTML =
    `<div class="acard"><h3>${t("admLogin")}</h3><p>${t("admLoginP")}</p>
       <form data-a="login" autocomplete="off">
         <label for="admtok">${t("admToken")}</label><input type="password" id="admtok" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
         <label class="chk"><input type="checkbox" id="admrem"> ${t("admRemember")}</label>
         <div class="arow"><button class="abtn" type="submit">${t("admSignIn")}</button>
           <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" style="color:var(--purple);font-weight:600">${t("admTokenHow")} ↗</a></div>
       </form>
       <div class="astat ${err?"show err":""}" id="admstat">${esc(err||"")}</div></div>
     <p class="anote">${t("admNote")}</p>`;
}

function admStatus(kind, text){
  const el = $id("admstat"); if (!el) return;
  el.className = "astat show " + (kind||""); el.textContent = text;
}

function runIcon(r){
  if (r.status !== "completed") return "⏳";
  return r.conclusion === "success" ? "✅" : "❌";
}
function runsHtml(list){
  if (!list.length) return `<p style="margin:0">${t("admNoRuns")}</p>`;
  return `<table class="runs">` + list.map(r =>
    `<tr><td>${runIcon(r)}</td><td>${esc((r.created_at||"").replace("T"," ").slice(0,16))}</td><td>${esc(r.event === "workflow_dispatch" ? "TEST" : r.event)}</td>
     <td style="text-align:right"><a href="${esc(r.html_url)}" target="_blank" rel="noopener noreferrer" style="color:var(--purple);font-weight:600">${t("admOpen")}</a></td></tr>`).join("") + `</table>`;
}
async function fetchRuns(n){
  const r = await ghApi(`/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=${n}`);
  if (!r.ok) return null;
  return (await r.json()).workflow_runs || [];
}
async function loadRuns(){
  const el = $id("admruns"); if (!el) return;
  const list = await fetchRuns(5);
  el.innerHTML = list ? runsHtml(list) : `<p style="margin:0">–</p>`;
}

async function sendTest(){
  const title = $id("admt").value.trim(), body = $id("admb").value, pre = $id("admp").checked;
  if (!title) { admStatus("err", t("admNeedTitle")); return; }
  const btn = $id("admsend"); btn.disabled = true;
  const started = Date.now();
  try {
    const r = await ghApi(`/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ref: adm.branch, inputs:{title, body, prerelease: String(pre)}})});
    if (r.status !== 204) {
      let m = ""; try { m = (await r.json()).message || ""; } catch(e){}
      const hint = r.status === 404 ? t("admFail404") : r.status === 422 ? t("admFail422") : "";
      admStatus("err", `${t("admFail")} (${r.status}). ${hint} ${m}`.trim());
      return;
    }
    admStatus("", t("admQueued"));
    for (let i = 0; i < 25; i++) {                       // ~75 s
      await sleep(3000);
      const list = await fetchRuns(5);
      if (!list) continue;
      const run = list.find(x => x.event === "workflow_dispatch" && Date.parse(x.created_at) >= started - 60000);
      if (!run) continue;
      if (run.status !== "completed") { admStatus("", t("admRun")); continue; }
      admStatus(run.conclusion === "success" ? "ok" : "err", run.conclusion === "success" ? t("admOk") : t("admRunFail"));
      const el = $id("admruns"); if (el) el.innerHTML = runsHtml(list);
      return;
    }
    admStatus("", t("admRun"));
    loadRuns();
  } catch(e){
    admStatus("err", t("admFail") + ": " + String((e && e.message) || e));
  } finally { btn.disabled = false; }
}

$id("admin").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const a = b.dataset.a;
  if (a === "send") sendTest();
  else if (a === "runs") loadRuns();
  else if (a === "madd") { adm.edit = {isNew:true, index:-1, mod:{id:"",game:"minecraft",name:"",desc:{sk:"",en:""},mc:"",prefix:"",zaloha:[],readme:{},gallery:[]}}; drawMods(); }
  else if (a === "medit") startEdit(+b.dataset.i);
  else if (a === "mdel") delMod(+b.dataset.i);
  else if (a === "mcancel") { adm.edit = null; drawMods(); }
  else if (a === "msave") saveMod();
  else if (a === "mgadd") $id("m_gal").insertAdjacentHTML("beforeend", galRow({}));
  else if (a === "mgdel") b.closest(".grow").remove();
  else if (a === "logout") { clearToken(); adm.state = "out"; adm.user = ""; adm.msg = ""; adm.mods = null; adm.edit = null; drawAdmin(); }
});
$id("admin").addEventListener("submit", e => {
  e.preventDefault();
  const tok = ($id("admtok").value || "").trim(); if (!tok) return;
  adm.token = tok;
  try { ($id("admrem").checked ? localStorage : sessionStorage).setItem(TKEY, tok); } catch(err){}
  verifyAdmin();
});

      mGal:"Galéria",mGalH:"Prvý obrázok je náhľad na karte. Zadaj URL, alebo nahraj súbor (uloží sa do repozitára).",mGalAdd:"+ Pridať obrázok",
      mUrl:"URL obrázka (alebo nahraj súbor nižšie)",mCapSk:"Popisok SK",mCapEn:"Popisok EN",mSave:"Uložiť",mCancel:"Zrušiť",mSaving:"Ukladám…",
      mSaved:"✅ Uložené. Stránka sa aktualizuje približne do minúty.",mNeed:"Vyplň názov, hru a aspoň krátky popis.",mDup:"Mod s týmto ID už existuje.",
      mFail:"Uloženie zlyhalo",mFail403:"Token nemá oprávnenie Contents: Read and write pre tento repozitár."},
  en:{mTitle:"Mods on the site",mP:"Add, edit or remove a mod. Changes are committed to the repository (mods.json) and the site updates within about a minute.",
      mAdd:"+ Add mod",mEdit:"Edit",mDelQ:"Really delete the mod",mEmpty:"No mods yet.",
      mHowDl:"Upload the mod file (.jar) as a new GitHub Release. The site finds it by the start of the file name.",
      mFormNew:"New mod",mFormEdit:"Edit mod",mName:"Mod name",mId:"ID (address #mod/…)",mIdH:"Leave empty to derive it from the name. It cannot be changed later.",mGame:"Game",
      mMc:"Game version / loader",mMcH:"E.g. Fabric 26.2 or ETS2 1.62",mPrefix:"File name prefix in Releases",mPrefixH:"E.g. tv-radio-mod for tv-radio-mod-6.3.0.jar. Empty = the ID.",
      mDsk:"Short description (SK)",mDen:"Short description (EN)",mReadme:"Long description (Markdown)",mReadmeH:"Shown on the mod's detail page. If left empty, the existing description is not changed.",
      mGal:"Gallery",mGalH:"The first image is the card thumbnail. Enter a URL or upload a file (it is stored in the repository).",mGalAdd:"+ Add image",
      mUrl:"Image URL (or upload a file below)",mCapSk:"Caption SK",mCapEn:"Caption EN",mSave:"Save",mCancel:"Cancel",mSaving:"Saving…",
      mSaved:"✅ Saved. The site updates within about a minute.",mNeed:"Fill in the name, the game and at least a short description.",mDup:"A mod with this ID already exists.",
      mFail:"Saving failed",mFail403:"The token lacks Contents: Read and write on this repository."}
};
const tm = k => TXM[lang][k];

const cleanMod = m => ({id:m.id, game:m.game, name:m.name,
  desc:{sk:(m.desc&&m.desc.sk)||(m.desc&&m.desc.en)||"", en:(m.desc&&m.desc.en)||(m.desc&&m.desc.sk)||""},
  mc:m.mc||"", prefix:(m.prefix||m.id||"").toLowerCase(), zaloha:m.zaloha||[], readme:m.readme||{},
  gallery:(m.gallery||[]).filter(g=>g&&g.src).map(g=>({src:g.src, cap:{sk:(g.cap&&g.cap.sk)||"", en:(g.cap&&g.cap.en)||""}}))});

const b64 = s => { let bin=""; new TextEncoder().encode(s).forEach(c => bin += String.fromCharCode(c)); return btoa(bin); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")), c => c.charCodeAt(0)));
const fileB64 = f => new Promise((res,rej) => { const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(f); });
const cpath = p => p.split("/").map(encodeURIComponent).join("/");
const isRel = u => !!u && !/^(https?:|data:|\/)/i.test(u);

async function getFile(path){
  const r = await ghApi(`/repos/${REPO}/contents/${cpath(path)}?ref=${encodeURIComponent(adm.branch)}`);
  if (r.status === 404) return null;
  if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
  const j = await r.json(); return Array.isArray(j) ? null : j;
}
async function putFile(path, contentB64, message){
  const old = await getFile(path);
  const r = await ghApi(`/repos/${REPO}/contents/${cpath(path)}`, {method:"PUT", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({message, content:contentB64, branch:adm.branch, sha: old ? old.sha : undefined})});
  if (!r.ok) { let m=""; try { m = (await r.json()).message || ""; } catch(e){} const e = new Error(`${r.status} ${m}`.trim()); e.status = r.status; throw e; }
}
const failMsg = e => (e && (e.status === 403 || e.status === 401)) ? tm("mFail403") : `${tm("mFail")}: ${String((e && e.message) || e)}`;
function mStatus(kind, text){ const el = $id("mstat"); if (!el) return; el.className = "astat show " + (kind||""); el.textContent = text; }

async function loadAdminMods(){
  adm.mods = null; adm.edit = null;
  try { const f = await getFile("mods.json"); if (f && f.content) adm.mods = JSON.parse(unb64(f.content)).map(cleanMod); } catch(e){}
  if (!adm.mods) adm.mods = MODS.map(cleanMod);   // mods.json ešte neexistuje: začni od modov zo stránky
  applyNeoForge(adm.mods);
  drawMods();
}
async function refreshLive(){
  MODS.splice(0, MODS.length, ...adm.mods.map(cleanMod));
  await loadVersions(); render(filter);
}

function galRow(g){
  return `<div class="grow">
    <input type="text" class="g-src" placeholder="${tm("mUrl")}" value="${esc(g.src||"")}">
    <input type="file" class="g-file" accept="image/*">
    <input type="text" class="g-csk" placeholder="${tm("mCapSk")}" value="${esc((g.cap&&g.cap.sk)||"")}">
    <input type="text" class="g-cen" placeholder="${tm("mCapEn")}" value="${esc((g.cap&&g.cap.en)||"")}">
    <button type="button" class="abtn ghost" data-a="mgdel">✕</button></div>`;
}
function formHtml(m, isNew){
  const games = Object.keys(GAMES).map(k => `<option value="${k}"${m.game===k?" selected":""}>${esc(GAMES[k])}</option>`).join("");
  return `<div class="acard"><h3>${tm(isNew?"mFormNew":"mFormEdit")}</h3>
    <label for="m_name">${tm("mName")}</label><input type="text" id="m_name" value="${esc(m.name)}" maxlength="80">
    <label for="m_id">${tm("mId")}</label><input type="text" id="m_id" value="${esc(m.id)}" ${isNew?"":"readonly"} maxlength="60">${isNew?`<p class="hint">${tm("mIdH")}</p>`:""}
    <label for="m_game">${tm("mGame")}</label><select id="m_game">${games}</select>
    <label for="m_mc">${tm("mMc")}</label><input type="text" id="m_mc" value="${esc(m.mc)}" maxlength="60"><p class="hint">${tm("mMcH")}</p>
    <label for="m_prefix">${tm("mPrefix")}</label><input type="text" id="m_prefix" value="${esc(m.prefix)}" maxlength="80"><p class="hint">${tm("mPrefixH")}</p>
    <label for="m_dsk">${tm("mDsk")}</label><textarea id="m_dsk" maxlength="400">${esc(m.desc.sk)}</textarea>
    <label for="m_den">${tm("mDen")}</label><textarea id="m_den" maxlength="400">${esc(m.desc.en)}</textarea>
    <label for="m_readme">${tm("mReadme")}</label><textarea id="m_readme" class="tall" spellcheck="false"></textarea><p class="hint">${tm("mReadmeH")}</p>
    <label>${tm("mGal")}</label><p class="hint" style="margin:0 0 .6rem">${tm("mGalH")}</p>
    <div id="m_gal">${m.gallery.map(galRow).join("")}</div>
    <button type="button" class="abtn ghost" data-a="mgadd">${tm("mGalAdd")}</button>
    <div class="arow"><button class="abtn" id="msave" data-a="msave">${tm("mSave")}</button><button class="abtn ghost" data-a="mcancel">${tm("mCancel")}</button></div>
    <div class="astat" id="mstat"></div></div>`;
}
function drawMods(){
  const box = $id("admmods"); if (!box || !adm.mods) return;
  if (adm.edit) { box.innerHTML = formHtml(adm.edit.mod, adm.edit.isNew); return; }
  box.innerHTML = `<div class="acard"><h3>${tm("mTitle")}</h3><p>${tm("mP")}</p>`
    + (adm.mods.length
      ? `<table class="runs">` + adm.mods.map((m,i) => `<tr><td><b>${esc(m.name)}</b><br><small>${esc(GAMES[m.game]||m.game)} · ${esc(m.mc)}</small></td>
          <td style="text-align:right;white-space:nowrap"><button class="abtn ghost" data-a="medit" data-i="${i}">${tm("mEdit")}</button> <button class="abtn ghost" data-a="mdel" data-i="${i}" aria-label="Delete">✕</button></td></tr>`).join("") + `</table>`
      : `<p>${tm("mEmpty")}</p>`)
    + `<div class="arow"><button class="abtn" data-a="madd">${tm("mAdd")}</button></div>
       <p class="anote">${tm("mHowDl")}</p><div class="astat" id="mstat"></div></div>`;
}
async function startEdit(i){
  const m = adm.mods[i]; adm.edit = {isNew:false, index:i, mod:m}; drawMods();
  const p = m.readme && (m.readme.en || m.readme.sk);
  if (isRel(p)) { try { const f = await getFile(p); if (f && f.content && $id("m_readme") && adm.edit && adm.edit.mod === m) $id("m_readme").value = unb64(f.content); } catch(e){} }
}
async function saveMod(){
  const e = adm.edit; if (!e) return;
  const v = id => $id(id).value.trim();
  const name = v("m_name"), game = $id("m_game").value, dsk = v("m_dsk"), den = v("m_den");
  const id = e.isNew ? slug(v("m_id") || name) : e.mod.id;
  if (!name || !id || !game || !(dsk || den)) { mStatus("err", tm("mNeed")); return; }
  if (e.isNew && adm.mods.some(x => x.id === id)) { mStatus("err", tm("mDup")); return; }
  const btn = $id("msave"); btn.disabled = true; mStatus("", tm("mSaving"));
  try {
    const mod = {id, game, name, desc:{sk:dsk||den, en:den||dsk}, mc:v("m_mc"), prefix:(v("m_prefix")||id).toLowerCase(),
                 zaloha:e.mod.zaloha||[], readme:Object.assign({}, e.mod.readme||{}), gallery:[]};
    for (const row of document.querySelectorAll("#m_gal .grow")) {
      let src = row.querySelector(".g-src").value.trim();
      const f = row.querySelector(".g-file").files[0];
      if (f) {
        const ext = ((f.name.match(/\.(png|jpe?g|gif|webp|svg)$/i)||[])[1] || "png").toLowerCase();
        const path = `mods/${id}/${slug(f.name.replace(/\.[^.]+$/,"")) || "img"}.${ext}`;
        mStatus("", `${tm("mSaving")} ${f.name}`);
        await putFile(path, await fileB64(f), `Add image ${path}`); src = path;
      }
      if (!src) continue;
      mod.gallery.push({src, cap:{sk:row.querySelector(".g-csk").value.trim(), en:row.querySelector(".g-cen").value.trim()}});
    }
    const md = $id("m_readme").value;
    if (md.trim()) {
      const key = mod.readme.en ? "en" : (mod.readme.sk ? "sk" : "en");
      const path = isRel(mod.readme[key]) ? mod.readme[key] : `mods/${id}/README.md`;
      await putFile(path, b64(md), `Update ${path}`); mod.readme[key] = path;
    }
    const list = adm.mods.slice(); if (e.isNew) list.push(mod); else list[e.index] = mod;
    await putFile("mods.json", b64(JSON.stringify(list, null, 2) + "\n"), `${e.isNew?"Add":"Update"} mod ${name}`);
    adm.mods = list; adm.edit = null; drawMods(); mStatus("ok", tm("mSaved"));
    refreshLive();
  } catch(err){ mStatus("err", failMsg(err)); const b = $id("msave"); if (b) b.disabled = false; }
}
async function delMod(i){
  const m = adm.mods[i]; if (!m || !confirm(`${tm("mDelQ")} „${m.name}“?`)) return;
  try {
    const list = adm.mods.filter((_,k) => k !== i);
    await putFile("mods.json", b64(JSON.stringify(list, null, 2) + "\n"), `Remove mod ${m.name}`);
    adm.mods = list; drawMods(); mStatus("ok", tm("mSaved")); refreshLive();
  } catch(err){ mStatus("err", failMsg(err)); }
}

/* ---------- smerovanie: #mod/<id> = detail, #admin = admin, inak zoznam ---------- */
function route(){
  const h = location.hash;
  if (h === "#admin") {
    curMod = null;
    document.body.classList.remove("detail-open"); document.body.classList.add("admin-open");
    document.title = "TajiiiMods – Admin";
    drawAdmin(); window.scrollTo(0,0);
    if (adm.token && adm.state === "out") verifyAdmin();
    return;
  }
  const wasAdmin = document.body.classList.contains("admin-open");
  document.body.classList.remove("admin-open");
  if (h.startsWith("#mod/")) {
    const m = MODS.find(x => x.id === decodeURIComponent(h.slice(5)));
    if (m) {
      if (curMod !== m) galIdx = 0;
      curMod = m;
      document.body.classList.add("detail-open");
      renderDetail(m); window.scrollTo(0,0); return;
    }
    document.getElementById("dbody").innerHTML = `<p>${t("notFound")}</p>`;
    document.body.classList.add("detail-open"); return;
  }
  const was = document.body.classList.contains("detail-open");
  document.body.classList.remove("detail-open"); curMod = null; document.title = "TajiiiMods";
  if ((was || wasAdmin) && h.length > 1) { const el = document.getElementById(h.slice(1)); if (el) el.scrollIntoView(); }
}
window.addEventListener("hashchange", route);

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
  filter = b.dataset.f; render(filter);
});
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.l;
  try { localStorage.setItem("lang", lang); } catch(e){}
  applyLang(); render(filter);
  if (curMod) { renderDetail(curMod); lbClose(); }
  if (document.body.classList.contains("admin-open")) drawAdmin();
});
applyLang();
document.getElementById("content").innerHTML = `<p>${t("load")}</p>`;
/* mods.json (ak existuje) má prednosť pred zoznamom MODS vyššie, ktorý slúži len ako záloha */
const NF_BUILTIN = JSON.parse(JSON.stringify(MODS.find(m=>m.id==="tv-radio-neoforge")||null));
/* NeoForge verzia je napevno v tomto súbore: ak v zozname modov (mods.json) žiadna nie je, pridá sa.
   Keď ju uložíš v admin paneli, použije sa tá uložená. */
function applyNeoForge(list){
  if (!NF_BUILTIN || !list) return list;
  if (!list.some(m => /neoforge/i.test(m.id+" "+m.name))) list.push(cleanMod(NF_BUILTIN));
  return list;
}
async function loadMods(){
  try {
    const r = await fetch("mods.json", {cache:"no-cache"});
    if (r.ok) { const d = await r.json(); if (Array.isArray(d)) MODS.splice(0, MODS.length, ...d.filter(m=>m&&m.id&&m.name&&m.game).map(cleanMod)); }
  } catch(e){}
  applyNeoForge(MODS);
}
loadMods().then(loadVersions).then(()=>{ render(filter); route(); });
</script>
