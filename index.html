<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TajiiiMods</title>
<style>
:root{--black:#0e0e12;--ink:#17171d;--purple:#7c3aed;--purple2:#a78bfa;--soft:#f5f3ff;--white:#fff;--muted:#6b6b7b;--line:#e7e4f3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:var(--white);color:var(--ink);line-height:1.55}
a{color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--black);color:#fff;border-bottom:1px solid #26262f}
.bar{max-width:1060px;margin:0 auto;padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.2rem;text-decoration:none;letter-spacing:.3px}
.logo span{color:var(--purple2)}
.lang{display:inline-flex;margin-left:1.3rem;border:1px solid #3a3a46;border-radius:8px;overflow:hidden;vertical-align:middle}
.lang button{background:none;border:0;color:#c9c9d6;padding:.3rem .7rem;cursor:pointer;font-size:.85rem;font-weight:600}
.lang button.on{background:var(--purple);color:#fff}
nav a{color:#c9c9d6;text-decoration:none;margin-left:1.3rem;font-size:.95rem}
nav a:hover{color:#fff}
.hero{background:radial-gradient(900px 300px at 80% -20%,#4c1d95 0%,transparent 70%),var(--black);color:#fff;padding:4rem 1.2rem 4.5rem;text-align:center}
.hero h1{margin:0;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:-1px}
.hero h1 em{font-style:normal;color:var(--purple2)}
.hero p{max-width:560px;margin:1rem auto 1.8rem;color:#b9b9c8}
.cta{display:inline-block;background:var(--purple);color:#fff;text-decoration:none;padding:.7rem 1.6rem;border-radius:10px;font-weight:600}
.cta:hover{background:#6d28d9}
section{max-width:1060px;margin:0 auto;padding:3rem 1.2rem}
h2{margin:0 0 .3rem;font-size:1.8rem;letter-spacing:-.5px}
.sub{color:var(--muted);margin:0 0 1.5rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem}
.chips button{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:.45rem 1.1rem;border-radius:999px;cursor:pointer;font-size:.95rem;font-weight:500}
.chips button.active{background:var(--ink);color:#fff}
.gh{display:flex;align-items:center;gap:.6rem;margin:2rem 0 1rem;font-size:1.25rem;font-weight:700}
.gh::after{content:"";flex:1;height:2px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.2rem}
.card{border:1.5px solid var(--line);border-radius:16px;padding:1.3rem;background:#fff;transition:.2s;display:flex;flex-direction:column}
.card:hover{border-color:var(--purple);box-shadow:0 8px 28px rgba(124,58,237,.14);transform:translateY(-2px)}
.card h3{margin:0 0 .5rem;font-size:1.15rem}
.tags{margin-bottom:.6rem}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:.15rem .65rem;border-radius:999px;background:var(--soft);color:var(--purple);margin:0 .3rem .3rem 0}
.tag.dark{background:var(--ink);color:#fff}
.card p{margin:0 0 1rem;color:var(--muted);font-size:.95rem;flex:1}
.btn{display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;padding:.6rem 1rem;border-radius:10px;font-weight:600;font-size:.95rem}
.btn:hover{background:var(--purple)}
details{margin-top:.9rem}
summary{cursor:pointer;font-weight:600;color:var(--purple);font-size:.92rem}
table{width:100%;border-collapse:collapse;margin-top:.6rem;font-size:.85rem}
th,td{text-align:left;padding:.4rem .2rem;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
td a{color:var(--purple);font-weight:600}
.about{background:var(--black);color:#fff}
.about .in{max-width:1060px;margin:0 auto;padding:3rem 1.2rem}
.about p{color:#b9b9c8;max-width:640px}
footer{background:var(--black);color:#8a8a9a;text-align:center;padding:1.5rem 1rem 2rem;font-size:.85rem;border-top:1px solid #26262f}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#top">Tajiii<span>Mods</span></a>
  <nav><a href="#top" data-i="home">Domov</a><a href="#mody" data-i="mods">Mody</a><a href="#kontakt" data-i="contact">Kontakt</a><span class="lang"><button data-l="sk">SK</button><button data-l="en">EN</button></span></nav>
</div></header>

<div class="hero" id="top">
  <h1 data-ih="hero"></h1>
  <p data-i="heroP"></p>
  <a class="cta" href="#mody" data-i="cta"></a>
</div>

<section id="mody">
  <h2 data-i="mods"></h2>
  <p class="sub" data-i="sub"></p>
  <div class="chips" id="tabs">
    <button data-f="all" class="active" data-i="all"></button>
    <button data-f="minecraft">Minecraft</button>
    <button data-f="ets2">ETS2</button>
  </div>
  <div id="content"></div>
</section>

<div class="about" id="kontakt"><div class="in">
  <h2 data-i="contact"></h2>
  <p data-i="contactP"></p>
</div></div>

<footer data-i="foot"></footer>

<script>
/* ============================================================
   NASTAVENIA
   Stránka si sama načíta súbory z GitHub Releases a zoradí ich
   podľa verzie. Najnovšia je na karte, ostatné idu do archívu.
   Staci nahrat novy .jar do Releases, index.html menit netreba.
   ============================================================ */
const REPO = "tajiii8095/tajiii8095.github.io";   // repozitár, kde sú Releases

const MODS = [
  {game:"minecraft", name:"TV Radio",
   desc:{sk:"Rádio a televízne vysielanie v Minecrafte: vysielače, veže, antény a televízory.",en:"Radio and TV broadcasting in Minecraft: transmitters, towers, antennas and televisions."},
   mc:"Fabric 26.2",
   prefix:"tv-radio-mod",   // súbory modu musia začínať týmto názvom, napr. tv-radio-mod-6.3.0.jar
   zaloha:["https://github.com/tajiii8095/tajiii8095.github.io/releases/download/tvradio/tv-radio-mod-6.2.2.jar"]}  // použije sa, ak GitHub nepovie nič
];
/* ============================================================ */

const TX = {
  sk:{home:"Domov",mods:"Mody",contact:"Kontakt",
      hero:"Mody pre <em>Minecraft</em><br>a <em>Euro Truck Simulator 2</em>",
      heroP:"Vlastné projekty, opravy a doplnky. Najnovšie verzie a archív všetkých starších vydaní na jednom mieste.",
      cta:"Prezrieť mody",sub:"Vyber hru a stiahni si najnovšiu verziu alebo niektorú zo starších v archíve.",all:"Všetko",
      contactP:"Nápad, chyba alebo otázka k modu? Napíš sem svoj Discord, e-mail alebo odkaz na YouTube.",
      foot:"Nezávislé mody. Minecraft a Euro Truck Simulator 2 sú ochranné známky ich vlastníkov.",
      dl:"Stiahnuť",dlv:"Stiahnuť v",arch:"Archív",archEmpty:"Archív (prázdny)",noOld:"Zatiaľ nie sú staršie verzie.",
      ver:"Verzia",date:"Dátum",na:"Zatiaľ nie je dostupná",none:"Zatiaľ žiadne mody.",load:"Načítavam…"},
  en:{home:"Home",mods:"Mods",contact:"Contact",
      hero:"Mods for <em>Minecraft</em><br>and <em>Euro Truck Simulator 2</em>",
      heroP:"Original projects, fixes and add-ons. The latest versions and an archive of all older releases in one place.",
      cta:"Browse mods",sub:"Pick a game and download the latest version or any older one from the archive.",all:"All",
      contactP:"Got an idea, a bug or a question about a mod? Put your Discord, e-mail or YouTube link here.",
      foot:"Independent mods. Minecraft and Euro Truck Simulator 2 are trademarks of their respective owners.",
      dl:"Download",dlv:"Download v",arch:"Archive",archEmpty:"Archive (empty)",noOld:"No older versions yet.",
      ver:"Version",date:"Date",na:"Not available yet",none:"No mods yet.",load:"Loading…"}
};
let lang = "sk";
try { const saved = localStorage.getItem("lang");
  if (saved === "sk" || saved === "en") lang = saved;
  else { const n = (navigator.language||"").toLowerCase(); lang = (n.startsWith("sk") || n.startsWith("cs")) ? "sk" : "en"; } } catch(e){}
if (lang !== "sk" && lang !== "en") lang = "en";
const t = k => TX[lang][k];
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  document.querySelectorAll("[data-ih]").forEach(e => e.innerHTML = t(e.dataset.ih));
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
}
const GAMES = {minecraft:"⛏️ Minecraft", ets2:"🚛 Euro Truck Simulator 2"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const verOf = n => (String(n).match(/(\d+(?:\.\d+)+)/)||[,"?"])[1];
const cmp = (a,b) => { const x=a.split(".").map(Number), y=b.split(".").map(Number);
  for (let i=0;i<Math.max(x.length,y.length);i++){ const d=(y[i]||0)-(x[i]||0); if(d) return d; } return 0; };

async function loadVersions(){
  for (const m of MODS) m.versions = [];
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`);
    if (!r.ok) throw 0;
    for (const rel of await r.json()){
      if (rel.draft) continue;
      for (const a of rel.assets||[]){
        const low = a.name.toLowerCase();
        for (const m of MODS) if (low.startsWith(m.prefix) && /\.(jar|zip)$/.test(low))
          m.versions.push({v:verOf(a.name), date:(rel.published_at||"").slice(0,10), note:rel.name||"", url:a.browser_download_url});
      }
    }
  } catch(e){}
  for (const m of MODS){
    if (!m.versions.length) m.versions = (m.zaloha||[]).map(u=>({v:verOf(u), date:"", note:"", url:u}));
    m.versions.sort((a,b)=>cmp(a.v,b.v));
  }
}

function card(m){
  const [latest,...old] = m.versions;
  if (!latest) return `<div class="card"><h3>${esc(m.name)}</h3><p>${esc(m.desc[lang])}</p><span class="btn" style="opacity:.5">${t("na")}</span></div>`;
  const archive = old.length
    ? `<details><summary>${t("arch")} (${old.length})</summary><table><tr><th>${t("ver")}</th><th>${t("date")}</th><th></th></tr>`
      + old.map(o=>`<tr><td>${esc(o.v)}</td><td>${esc(o.date)}</td><td><a href="${esc(o.url)}">${t("dl")}</a></td></tr>`).join("")
      + `</table></details>`
    : `<details><summary>${t("archEmpty")}</summary><p style="margin-top:.5rem">${t("noOld")}</p></details>`;
  return `<div class="card"><h3>${esc(m.name)}</h3>
    <div class="tags"><span class="tag dark">${esc(m.mc)}</span><span class="tag">v${esc(latest.v)}</span>${latest.date?`<span class="tag">${esc(latest.date)}</span>`:""}</div>
    <p>${esc(m.desc[lang])}</p>
    <a class="btn" href="${esc(latest.url)}">${t("dlv")}${esc(latest.v)}</a>${archive}</div>`;
}

function render(f){
  let html = "";
  for (const g of Object.keys(GAMES)){
    if (f !== "all" && f !== g) continue;
    const list = MODS.filter(m => m.game === g);
    html += `<div class="gh">${GAMES[g]}</div>` + (list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p>${t("none")}</p>`);
  }
  document.getElementById("content").innerHTML = html;
}

let filter = "all";
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
  filter = b.dataset.f; render(filter);
});
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.l;
  try { localStorage.setItem("lang", lang); } catch(e){}
  applyLang(); render(filter);
});
applyLang();
document.getElementById("content").innerHTML = `<p>${t("load")}</p>`;
loadVersions().then(()=>render(filter));
</script>
</body>
</html>
