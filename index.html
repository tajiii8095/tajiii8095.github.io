<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var q=new URLSearchParams(location.search).get("brand"),b=q||sessionStorage.getItem("brand");if(b==="firiii")document.documentElement.classList.add("brand-firiii")}catch(e){}</script>
<title>TajiiiMods</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--accr:139,92,246;--acc2r:183,157,255;--deep:109,40,217;--ph:#9b72ff;--g1:#e0d4ff;--g2:#a78bfa;--g3:#7c3aed;--o1:#c4b0ff;--o2:#7c3aed;--o3:#2a1060;--codec:#d4c5ff;--black:#0a0a0f;--s1:#13131b;--s2:#1a1a25;--ink:#ececf4;--muted:#9494aa;--line:#262636;--soft:#1a1a26;--white:#13131b;--purple:#8b5cf6;--purple2:#b79dff;--purple3:#6d28d9;--hf:"Space Grotesk","Inter",system-ui,sans-serif;--glow:0 12px 40px rgba(var(--accr),.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--black);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;background-image:radial-gradient(900px 500px at 100% -5%,rgba(var(--deep),.28),transparent 70%)}
a{color:inherit}::selection{background:var(--purple);color:#fff}:focus-visible{outline:2px solid var(--purple2);outline-offset:2px;border-radius:8px}
html.brand-firiii{--purple:#e5383b;--purple2:#ff8f7a;--purple3:#b91c1c;--accr:229,56,59;--acc2r:255,143,122;--deep:153,27,27;--ph:#f25558;--g1:#ffe0cc;--g2:#ff7a5c;--g3:#dc2626;--o1:#ffb199;--o2:#dc2626;--o3:#3d0808;--codec:#ffc9bd;--glow:0 12px 40px rgba(229,56,59,.38)}
.gcard[data-brand=firiii]{--purple:#e5383b;--purple2:#ff8f7a;--accr:229,56,59;--glow:0 12px 40px rgba(229,56,59,.38)}
/* plávajúca lišta */
header{position:sticky;top:0;z-index:20;padding:.8rem 1rem;pointer-events:none}
.bar{pointer-events:auto;max-width:980px;margin:0 auto;padding:.5rem .6rem .5rem 1.3rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid var(--line);border-radius:999px;background:rgba(19,19,27,.72);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.logo{font:800 1.2rem var(--hf);text-decoration:none;letter-spacing:-.02em}.logo span{color:var(--purple2)}
nav{display:flex;align-items:center;gap:.2rem}
nav a{color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500;padding:.45rem .9rem;border-radius:999px;transition:.2s}nav a:hover{color:#fff;background:var(--s2)}
.lang{display:inline-flex;margin-left:.5rem;background:var(--black);border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{background:none;border:0;color:var(--muted);padding:.3rem .75rem;cursor:pointer;font:600 .8rem Inter,sans-serif;border-radius:999px}.lang button.on{background:var(--purple);color:#fff}
/* hero */
.hero{padding:3.5rem 1.2rem 4rem}
.hin{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:2rem;align-items:center}
.kick{display:inline-block;font:600 .78rem Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--purple2);border:1px solid rgba(var(--acc2r),.3);background:rgba(var(--accr),.1);padding:.3rem .8rem;border-radius:999px}
.hero h1{margin:1rem 0 0;font:700 clamp(2.4rem,6.2vw,4.6rem)/1.02 var(--hf);letter-spacing:-.045em}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:480px;margin:1.3rem 0 2rem;color:var(--muted);font-size:1.08rem}
.cta{display:inline-flex;align-items:center;gap:.5rem;background:var(--purple);color:#fff;text-decoration:none;padding:.9rem 1.8rem;border-radius:14px;font-weight:600;box-shadow:var(--glow);transition:.2s}.cta::after{content:"→";transition:transform .2s}.cta:hover{background:var(--ph);transform:translateY(-2px)}.cta:hover::after{transform:translateX(4px)}
.hviz{position:relative;height:320px}
.orb{position:absolute;inset:8% 10%;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--o1),var(--o2) 45%,var(--o3) 80%);filter:blur(2px);opacity:.85;box-shadow:0 0 120px rgba(var(--accr),.55)}
.hc{position:absolute;padding:.8rem 1.2rem;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(19,19,27,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 1rem var(--hf);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.c1{left:0;top:12%;transform:rotate(-6deg)}.c2{right:0;top:42%;transform:rotate(5deg)}.c3{left:14%;bottom:6%;transform:rotate(-2deg);color:var(--purple2)}
/* sekcie */
section{max-width:1100px;margin:0 auto;padding:2.5rem 1.2rem 3rem}
h2{margin:0 0 .4rem;font:700 clamp(1.8rem,4vw,2.5rem) var(--hf);letter-spacing:-.035em}
.sub{color:var(--muted);margin:0 0 1.4rem}
.chips{display:inline-flex;gap:.2rem;padding:.3rem;margin-bottom:.8rem;background:var(--s1);border:1px solid var(--line);border-radius:999px;flex-wrap:wrap}
.chips button{border:0;background:none;color:var(--muted);padding:.5rem 1.2rem;border-radius:999px;cursor:pointer;font:600 .92rem Inter,sans-serif;transition:.2s}.chips button:hover{color:#fff}
.chips button.active{background:var(--purple);color:#fff;box-shadow:0 4px 16px rgba(var(--accr),.45)}
.gh{display:flex;align-items:center;gap:.7rem;margin:2.2rem 0 1rem;font:700 1.35rem var(--hf);letter-spacing:-.02em}.gh::before{content:"";width:6px;height:1.4em;border-radius:3px;background:linear-gradient(var(--purple2),var(--purple3))}
/* karty = široké riadky */
.grid{display:grid;gap:1rem}
.card{display:grid;grid-template-columns:270px auto auto 1fr;column-gap:.7rem;align-content:start;padding:1rem;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,var(--s1),#0f0f16);transition:.25s}
.card:hover{border-color:rgba(var(--accr),.6);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(var(--accr),.25);transform:translateY(-3px)}
.card::before{content:"⬡";display:flex;align-items:center;justify-content:center;font-size:3rem;color:rgba(var(--acc2r),.5);grid-column:1;grid-row:1/span 8;min-height:150px;margin-right:.8rem;border-radius:16px;background:radial-gradient(circle at 30% 20%,rgba(var(--accr),.4),transparent 70%),var(--s2)}
.card:has(.thumb)::before{display:none}
.card>.thumb{grid-column:1;grid-row:1/span 8;position:relative;display:block;margin:0 .8rem 0 0;min-height:150px;border-radius:16px;overflow:hidden;background:var(--s2)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}.card:hover .thumb img{transform:scale(1.06)}
.card>*:not(.thumb){grid-column:2/-1}
.card>.btn{grid-column:2;justify-self:start;margin-top:.9rem}.card>.btn.ghost{grid-column:3}
.card h3{margin:.2rem 0 .5rem;font:700 1.3rem var(--hf);letter-spacing:-.025em}
.tags{margin-bottom:.5rem}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:.18rem .7rem;border-radius:999px;background:rgba(var(--accr),.14);color:var(--purple2);margin:0 .3rem .3rem 0}
.tag.dark{background:var(--ink);color:var(--black)}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.btn{display:inline-block;text-align:center;background:var(--purple);color:#fff;text-decoration:none;padding:.65rem 1.3rem;border-radius:12px;font-weight:600;font-size:.92rem;transition:.2s}
.btn:hover{background:var(--ph);box-shadow:0 8px 24px rgba(var(--accr),.4)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--s2);border-color:var(--purple2);box-shadow:none}
details{margin-top:.9rem}summary{cursor:pointer;font-weight:600;color:var(--purple2);font-size:.9rem}
table{width:100%;border-collapse:collapse;margin-top:.6rem;font-size:.85rem}th,td{text-align:left;padding:.45rem .3rem;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}td a{color:var(--purple2);font-weight:600}
/* kontakt */
.about{max-width:1100px;margin:1rem auto 3rem;padding:0 1.2rem}
.about .in{padding:2.6rem;border:1px solid var(--line);border-radius:28px;background:radial-gradient(500px 240px at 100% 0%,rgba(var(--accr),.3),transparent 70%),var(--s1)}
.about p{color:var(--muted);max-width:560px}.dc{margin:1.2rem 0 .6rem}.dcbtn{padding:.8rem 1.6rem;border-radius:14px}.dcnick{margin:0}.dcnick strong{color:#fff}
footer{color:var(--muted);text-align:center;padding:1.5rem 1rem 2.2rem;font-size:.85rem;border-top:1px solid var(--line)}.adm{text-decoration:none;opacity:.35;margin-left:.6rem}.adm:hover{opacity:1}
/* detail: dva stĺpce */
#detail{display:none;max-width:1100px;margin:0 auto;padding:1rem 1.2rem 4rem}body.detail-open #detail{display:block}
body.detail-open .hero,body.detail-open #mody,body.detail-open .about{display:none}
.back{display:inline-block;margin-bottom:1.2rem;padding:.45rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--s1);color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none}.back:hover{border-color:var(--purple2);color:var(--purple2)}
#dbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:2rem;align-items:start}
#dbody>*{grid-column:1}#dbody>.dhead{grid-column:1/-1}
#dbody>#pkbox{grid-column:2;grid-row:2/span 40;position:sticky;top:5.5rem}
.dhead{display:flex;gap:1.2rem;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:1.6rem;padding:1.8rem;border:1px solid var(--line);border-radius:28px;background:radial-gradient(500px 220px at 0% 0%,rgba(var(--accr),.28),transparent 70%),var(--s1)}
.dhead h1{margin:0 0 .6rem;font:700 clamp(1.8rem,4.5vw,2.8rem) var(--hf);letter-spacing:-.04em;line-height:1.05}.dhead .btn{padding:.85rem 1.7rem}.dl-box{min-width:200px}.dl-box details{margin-top:.6rem}
.picker{border:1px solid var(--line);border-radius:22px;padding:1.2rem;background:var(--s1)}
.picker h4{margin:0 0 .9rem;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.pk-sel{display:grid;gap:.6rem;margin-bottom:.9rem}.pk-sel label{display:flex;flex-direction:column;gap:.25rem;font-size:.75rem;color:var(--muted);font-weight:600}
.pk-sel select{width:100%;padding:.6rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--black);font:inherit;font-weight:600;color:var(--ink)}
.pk-row{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.7rem .8rem;border:1px solid var(--line);border-radius:14px;margin-top:.5rem;background:var(--black);transition:.2s}.pk-row:hover{border-color:var(--purple)}
.pk-row b{font-size:1rem}.pk-row small{display:block;color:var(--muted);margin-top:.1rem;font-size:.75rem;overflow-wrap:anywhere}.pk-row .tag{margin-left:.4rem}.pk-row .btn{padding:.5rem 1rem;flex:0 0 auto}.pk-none{color:var(--muted);margin:.2rem 0 0}
.sec-title{font:700 1.25rem var(--hf);margin:2rem 0 .8rem;display:flex;align-items:center;gap:.6rem}.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.gal-main{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--s1);cursor:zoom-in;aspect-ratio:16/9}.gal-main img{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.gal-cap{color:var(--muted);font-size:.9rem;margin:.5rem .2rem 0;min-height:1.3em}
.gal-thumbs{display:flex;gap:.6rem;margin-top:.7rem;overflow-x:auto;padding-bottom:.4rem}
.gal-thumbs button{flex:0 0 auto;width:110px;aspect-ratio:16/10;padding:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;background:#000;opacity:.65;transition:.2s}.gal-thumbs button.on{border-color:var(--purple);opacity:1}.gal-thumbs button:hover{opacity:1}.gal-thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.md{overflow-wrap:anywhere}.md h1{font:700 1.9rem var(--hf);margin:1.6rem 0 .6rem}.md h2{font:700 1.5rem var(--hf);margin:2.2rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--line)}.md h3{font-size:1.2rem;margin:1.6rem 0 .4rem}.md h4{font-size:1.05rem;margin:1.2rem 0 .3rem}
.md p,.md li{color:#c9c9d8}.md li{margin:.25rem 0}.md a{color:var(--purple2);font-weight:600}.md img{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin:.4rem 0}
.md code{background:var(--s2);color:var(--codec);padding:.1rem .4rem;border-radius:6px;font-size:.88em}.md pre{background:#07070b;color:#e8e8f2;padding:1rem;border-radius:14px;overflow-x:auto;border:1px solid var(--line)}.md pre code{background:none;color:inherit;padding:0}
.md blockquote{margin:1rem 0;padding:.6rem 1rem;border-left:4px solid var(--purple);background:var(--s1);border-radius:0 12px 12px 0}.md blockquote p{margin:.3rem 0}.md hr{border:0;height:1px;background:var(--line);margin:2rem 0}
.md .tw{overflow-x:auto;margin:.8rem 0}.md table{font-size:.9rem;min-width:420px}.md th,.md td{padding:.5rem .6rem;vertical-align:top}.md th{background:var(--s1);color:var(--ink)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,5,8,.95);display:none;align-items:center;justify-content:center;flex-direction:column;padding:1rem}.lb.open{display:flex}
.lb img{max-width:96vw;max-height:80vh;object-fit:contain;border-radius:10px}.lb .cap{color:#d8d8e6;margin-top:.8rem;text-align:center;max-width:90vw}
.lb button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;width:46px;height:46px;font-size:1.5rem;cursor:pointer}.lb button:hover{background:var(--purple)}.lb .x{top:1rem;right:1rem}.lb .p{left:1rem;top:50%}.lb .n{right:1rem;top:50%}
/* admin */
#admin{display:none;max-width:760px;margin:0 auto;padding:1rem 1.2rem 3rem}body.admin-open #admin{display:block}
body.admin-open .hero,body.admin-open #mody,body.admin-open .about,body.admin-open #detail{display:none}
#admin h1{margin:.2rem 0 1.2rem;font:700 clamp(1.6rem,4.5vw,2.3rem) var(--hf);letter-spacing:-.03em}
.acard{border:1px solid var(--line);border-radius:22px;padding:1.4rem;margin-bottom:1.2rem;background:var(--s1)}
.acard h3{margin:0 0 .3rem;font:700 1.15rem var(--hf)}.acard p{color:var(--muted);font-size:.92rem;margin:.2rem 0 1rem}.acard label{display:block;font-weight:600;font-size:.9rem;margin:.9rem 0 .35rem}
.acard input[type=text],.acard input[type=password],.acard textarea,.acard select{width:100%;font:inherit;padding:.65rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--black);color:var(--ink)}
.acard input:focus,.acard textarea:focus,.acard select:focus{outline:0;border-color:var(--purple);box-shadow:0 0 0 3px rgba(var(--accr),.22)}
.acard textarea{min-height:110px;resize:vertical}.acard textarea.tall{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem}.acard input[readonly]{opacity:.7}
.chk{display:flex;align-items:center;gap:.5rem;font-weight:500;margin:.9rem 0 0}.chk input{width:1.05rem;height:1.05rem;accent-color:var(--purple)}
.arow{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1.1rem}
.abtn{border:0;cursor:pointer;font:inherit;font-weight:600;background:var(--purple);color:#fff;padding:.7rem 1.4rem;border-radius:12px;transition:.2s}.abtn:hover{background:var(--ph)}.abtn:disabled{opacity:.5;cursor:default}
.abtn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.abtn.ghost:hover{background:var(--s2);border-color:var(--purple2)}
.who{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.who b{color:var(--purple2)}
.astat{margin-top:1rem;padding:.7rem .9rem;border-radius:12px;font-size:.92rem;background:var(--s2);display:none;overflow-wrap:anywhere}.astat.show{display:block}.astat.ok{background:rgba(34,197,94,.12);color:#86efac}.astat.err{background:rgba(239,68,68,.12);color:#fca5a5}
.anote,.hint{font-size:.82rem;color:var(--muted);margin-top:.3rem}.runs{width:100%;font-size:.9rem}.runs td{padding:.5rem .2rem}
.grow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:start;gap:.7rem;border:1px dashed var(--line);border-radius:12px;padding:.7rem;margin-bottom:.6rem}.grow .abtn{justify-self:start;padding:.4rem .9rem}
.gprev{width:96px;height:72px;border-radius:10px;background:var(--s2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.4rem}.gprev img{width:100%;height:100%;object-fit:cover;display:block}.gprev img[hidden]{display:none}
.gform{display:grid;gap:.4rem;min-width:0}.gform input[type=file]{font:inherit;font-size:.85rem;max-width:100%;color:var(--muted)}.gtag{font-size:.85rem;font-weight:600;color:var(--purple2);overflow-wrap:anywhere}.gbtn{display:flex;gap:.3rem}.gbtn .abtn{padding:.4rem .7rem}
.drop{display:block;text-align:center;cursor:pointer;border:2px dashed var(--line);border-radius:14px;padding:1.1rem .8rem;margin:.2rem 0 .8rem;color:var(--muted);font-weight:600}.drop:hover,.drop.over{border-color:var(--purple);background:var(--s2);color:var(--purple2)}
/* mobil */
@media(max-width:860px){.hin{grid-template-columns:1fr}.hviz{height:200px;order:-1}.card{grid-template-columns:auto auto 1fr}.card::before,.card>.thumb{grid-column:1/-1;grid-row:auto;margin:0 0 .9rem;aspect-ratio:16/9;min-height:0}.card::before{min-height:0}.card>*:not(.thumb){grid-column:1/-1}.card>.btn{grid-column:1}.card>.btn.ghost{grid-column:2}#dbody{grid-template-columns:1fr}#dbody>#pkbox{grid-column:1;grid-row:auto;position:static;margin-bottom:1rem}}
@media(max-width:560px){nav a{padding:.4rem .55rem;font-size:.85rem}.logo{font-size:1.05rem}.bar{padding-left:1rem}.grow{grid-template-columns:72px minmax(0,1fr)}.gprev{width:72px;height:56px}.gbtn{grid-column:1/-1}.about .in{padding:1.6rem}}
/* výber značky */
#gate{display:none;max-width:900px;margin:0 auto;padding:4rem 1.2rem 5rem;text-align:center}
body.gate-open #gate{display:block}
body.gate-open .hero,body.gate-open #mody,body.gate-open .about,body.gate-open #detail,body.gate-open #admin{display:none!important}
body.gate-open nav a,body.gate-open footer .adm{display:none}
#gate h1{margin:0 0 .6rem;font:700 clamp(2rem,5vw,3.2rem) var(--hf);letter-spacing:-.04em}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;margin-top:2rem}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:2.2rem;text-align:left;cursor:pointer;color:var(--ink);padding:1.8rem;border:1px solid var(--line);border-radius:28px;background:radial-gradient(420px 200px at 100% 0%,rgba(var(--accr),.3),transparent 70%),var(--s1);transition:.25s;font:inherit}
.gcard b{font:700 2rem var(--hf);letter-spacing:-.04em}.gcard b span{color:var(--purple2)}
.gcard i{font-style:normal;font-weight:600;color:var(--purple2)}
.gcard:hover{border-color:var(--purple);transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.5),var(--glow)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#top">Tajiii<span>Mods</span></a>
  <nav><a href="#top" data-i="home">Domov</a><a href="#mody" data-i="mods">Mody</a><a href="#kontakt" data-i="contact">Kontakt</a><a href="#" id="switchB" data-i="switchB"></a><span class="lang"><button data-l="sk">SK</button><button data-l="en">EN</button></span></nav>
</div></header>

<div id="gate"><div class="gin">
  <h1 data-i="gateT"></h1><p class="sub" data-i="gateP"></p>
  <div class="gcards">
    <button class="gcard" data-brand="tajiii"><b>Tajiii<span>Mods</span></b><i><span data-i="gateGo"></span> →</i></button>
    <button class="gcard" data-brand="firiii"><b>Firiii<span>Mods</span></b><i><span data-i="gateGo"></span> →</i></button>
  </div>
</div></div>

<div class="hero" id="top"><div class="hin">
  <div class="htxt">
    <span class="kick">Minecraft · ETS2</span>
    <h1 data-ih="hero"></h1>
    <p data-i="heroP"></p>

async function loadVersions(){
  for (const m of MODS) m.versions = [];
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases?per_page=100`);
    if (!r.ok) throw 0;
    for (const rel of await r.json()){
      if (rel.draft) continue;
      for (const a of rel.assets||[]){
        const low = a.name.toLowerCase();
        for (const m of MODS) if (prefList(m).some(p=>low.startsWith(p)) && /\.(jar|zip)$/.test(low))
          m.versions.push({file:a.name, v:verOf(a.name), date:(rel.published_at||"").slice(0,10), note:rel.name||"", url:a.browser_download_url, dc:a.download_count||0});
      }
    }
  } catch(e){}
  for (const m of MODS){
    if ((m.sharemods||[]).length) m.versions = m.sharemods.map(x => ({file:"", v:(String(x.v).match(/\d+(?:\.\d+)*/)||[String(x.v)])[0], date:x.date||"", note:"", url:x.url, sm:true}));
    if (!m.versions.length) m.versions = (m.zaloha||[]).map(u=>({file:baseName(u), v:verOf(u), date:"", note:"", url:u}));
    for (const x of m.versions){ x.loader = prefLoader(m, x.file||"") || loaderOf(x.file||"", m); x.mc = gameOf(x.file||"", m); }
    m.versions.sort((a,b)=>cmp(a.v,b.v));
    m.downloads = m.versions.some(x=>x.dc!==undefined) ? m.versions.reduce((n,x)=>n+(x.dc||0),0) : null;
  }
}

/* ---------- Markdown ---------- */
function mdToHtml(txt){
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(txt,{gfm:true}));
  return "<pre>"+esc(txt)+"</pre>";   // keď sa nenačíta knižnica (CDN), ukáže sa aspoň čistý text
}
function fixMd(box, base){
  box.querySelectorAll("h1,h2,h3,h4").forEach(h => { if(!h.id) h.id = "md-"+slug(h.textContent); });
  box.querySelectorAll("table").forEach(tb => { const w=document.createElement("div"); w.className="tw"; tb.replaceWith(w); w.appendChild(tb); });
  box.querySelectorAll("img").forEach(i => { const s=i.getAttribute("src")||"";
    if (s && !/^(https?:|data:|\/)/i.test(s)) i.src = new URL(s, base).href; i.loading="lazy"; });
  box.querySelectorAll("a[href]").forEach(a => { const h=a.getAttribute("href")||"";
    if (/^https?:/i.test(h)) { a.target="_blank"; a.rel="noopener noreferrer"; }
    else if (h.startsWith("#")) a.dataset.md = "md-"+slug(decodeURIComponent(h.slice(1)));
    else if (!/^(mailto:|\/)/i.test(h)) a.href = new URL(h, base).href; });
}
async function loadReadme(m){
  const box = document.getElementById("mdbox"); if (!box) return;
  const url = pick(m.readme);
  if (!url) { box.innerHTML = `<p class="sub">${t("noReadme")}</p>`; return; }
  const token = ++readmeToken;
  box.innerHTML = `<p class="sub">${t("load")}</p>`;
  try {
    const r = await fetch(url, {cache:"no-cache"}); if (!r.ok) throw new Error("HTTP "+r.status);
    let txt = await r.text();
    if (m.swapFabric) txt = txt.replace(/Fabric/g,"NeoForge").replace(/FABRIC/g,"NEOFORGE");
    if (token !== readmeToken) return;
    box.innerHTML = mdToHtml(txt);
    fixMd(box, new URL(url, location.href));
  } catch(e){ if (token === readmeToken) box.innerHTML = `<p class="sub">${t("readmeErr")}<br><small>${esc(url)} — ${esc(e && e.message || e)}</small></p>`; }
}

let pk = {game:"", loader:""};
function pkFiles(m){ return MODS.filter(x => x.game===m.game && famKey(x)===famKey(m)).flatMap(x => x.versions||[]); }
function pickerHtml(m){
  const files = pkFiles(m);
  if (!files.length) return "";
  const games = [...new Set(files.map(f=>f.mc))].sort(cmp);
  if (!games.includes(pk.game)) pk.game = games[0];
  const loaders = [...new Set(files.filter(f=>f.mc===pk.game).map(f=>f.loader))].sort((x,y)=>Object.keys(LOADERS).indexOf(x)-Object.keys(LOADERS).indexOf(y));
  if (!loaders.includes(pk.loader)) pk.loader = loaders[0];
  const rows = files.filter(f=>f.mc===pk.game && f.loader===pk.loader).sort((a,b)=>cmp(a.v,b.v));
  const ln = k => LOADERS[k]||k;
  return `<div class="picker"><h4>${t("pickTitle")}</h4>
    <div class="pk-sel">
      <label>${t("pickGame")}<select data-pk="game">${games.map(g=>`<option value="${esc(g)}"${g===pk.game?" selected":""}>${esc(g)}</option>`).join("")}</select></label>
      <label>${t("pickLoader")}<select data-pk="loader">${loaders.map(l=>`<option value="${esc(l)}"${l===pk.loader?" selected":""}>${esc(ln(l))}</option>`).join("")}</select></label>
    </div>`
    + (rows.length ? rows.map((f,i)=>`<div class="pk-row"><div><b>${esc(f.v)}</b>${i===0?`<span class="tag">${t("pickLatest")}</span>`:""}
        <small>${esc(f.file||"")}${f.date?` · ${esc(f.date)}`:""}${f.dc!==undefined?` · ⬇ ${f.dc.toLocaleString(lang==="sk"?"sk-SK":"en-US")}`:""}</small></div>
        <a class="btn" href="${esc(f.url)}">${t("dl")}</a></div>`).join("") : `<p class="pk-none">${t("pickNone")}</p>`)
    + `</div>`;
}
function renderDetail(m){
  const [latest] = m.versions;

    : latest
    ? `<a class="btn" href="${esc(latest.url)}"${tgt(latest)}>${t("dlv")}${esc(latest.v)}</a>`

    + galHtml(m)

/* ---------- admin panel ----------
   Prihlasovanie je meno + heslo. Heslá ani GitHub token NIE SÚ v tomto súbore: sú v Cloudflare Workeri (worker.js),
   ktorý heslo overí a až potom za teba volá GitHub API. Panel dostane len dočasnú reláciu (platí 12 hodín).
   Webhook zostáva v GitHub Secrets. Test posiela GitHub Actions workflow cez workflow_dispatch. */
const WORKER = "https://prihlasovanie.taii.workers.dev";   // URL tvojho Workera, napr. "https://tajiiimods-admin.TVOJE-MENO.workers.dev" (bez lomky na konci)
const ADMIN_USERS = [].concat(B.admin).map(x => x.toLowerCase());            // len tento GitHub účet sa dostane dnu
const WORKFLOW   = B.workflow;   // súbor v .github/workflows/
const TKEY = "gh_admin_token" + (BID && BID !== "tajiii" ? "_" + BID : "");
const adm = { token:"", user:"", branch:"main", state:"out", msg:"", prev:{} };   // state: out | checking | in | denied
try { adm.token = sessionStorage.getItem(TKEY) || localStorage.getItem(TKEY) || ""; } catch(e){}

const ghApi = (path, opt) => fetch(WORKER+"/gh"+path, Object.assign({}, opt, {
  headers: Object.assign({"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Authorization":"Bearer "+adm.token}, (opt&&opt.headers)||{})}));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $id = id => document.getElementById(id);

function clearToken(){ adm.token = ""; try { sessionStorage.removeItem(TKEY); localStorage.removeItem(TKEY); } catch(e){} }

async function verifyAdmin(){
  adm.state = "checking"; adm.msg = ""; drawAdmin();
  try {
    if (!WORKER) throw new Error(t("admNoWorker"));
    const m = await fetch(WORKER+"/me", {headers:{"Authorization":"Bearer "+adm.token}});
    if (m.status === 401 || m.status === 403) throw new Error(t("admBadToken"));
    if (!m.ok) throw new Error("Worker " + m.status);
    const me = await m.json();
    const r = await ghApi("/repos/" + REPO);
    if (r.status === 401 || r.status === 403) throw new Error(t("admBadToken"));
    if (!r.ok) throw new Error(t("admNoRepo"));
    const repo = await r.json();
    adm.user = me.user || "";
    if (!(repo.permissions && repo.permissions.push)) {
      adm.why = lang === "sk" ? "GitHub token vo Workeri nemá právo zapisovať do repozitára (skontroluj Contents: Read and write)" : "the GitHub token in the Worker cannot write to the repository (check Contents: Read and write)";
      adm.state = "denied"; clearToken(); drawAdmin(); return;
    }
    adm.branch = repo.default_branch || "main";
    adm.state = "in";
  } catch(e){ adm.state = "out"; adm.msg = (e instanceof TypeError) ? t("admNetErr") : String((e && e.message) || e); clearToken(); }
  drawAdmin();
  if (adm.state === "in") { loadRuns(); loadAdminMods(); }
}

function drawAdmin(){
  const box = $id("admbody"); if (!box) return;
  if (adm.state === "checking") { box.innerHTML = `<div class="acard"><p style="margin:0">${t("admChecking")}</p></div>`; return; }
  if (adm.state === "in") {
    const v = MODS[0] && MODS[0].versions && MODS[0].versions[0];
    const defTitle = MODS[0] ? (MODS[0].name + (v ? " " + v.v : "")) : "";
    box.innerHTML =
      `<div class="acard who"><span>${t("admAs")} <b>${esc(adm.user)}</b></span><button class="abtn ghost" data-a="logout">${t("admSignOut")}</button></div>
       <div id="admmods"></div>
       <div class="acard"><h3>${t("admTestT")}</h3><p>${t("admTestP")}</p>
         <label for="admt">${t("admRelTitle")}</label><input type="text" id="admt" value="${esc(defTitle)}" maxlength="100">
         <label for="admb">${t("admRelBody")}</label><textarea id="admb" maxlength="1500"></textarea>
         <label class="chk"><input type="checkbox" id="admp"> ${t("admPre")}</label>
         <div class="arow"><button class="abtn" id="admsend" data-a="send">${t("admSend")}</button></div>
         <div class="astat" id="admstat"></div></div>
       <div class="acard"><h3>${t("admRuns")}</h3><div id="admruns"></div>
         <div class="arow"><button class="abtn ghost" data-a="runs">${t("admRefresh")}</button></div></div>
       <p class="anote">${t("admNote")}</p>`;
    if (adm.mods) drawMods();
    return;
  }
  const err = adm.state === "denied" ? t("admDenied") + " " + (adm.why || "") : adm.msg;
  box.innerHTML =
    `<div class="acard"><h3>${t("admLogin")}</h3><p>${t("admLoginP")}</p>
       <form data-a="login">
         <label for="admuser">${t("admUser")}</label><input type="text" id="admuser" autocomplete="username" autocapitalize="off" spellcheck="false">
         <label for="admpass">${t("admPass")}</label><input type="password" id="admpass" autocomplete="current-password" spellcheck="false">
         <label class="chk"><input type="checkbox" id="admrem"> ${t("admRemember")}</label>
         <div class="arow"><button class="abtn" type="submit">${t("admSignIn")}</button></div>
       </form>
       <div class="astat ${err?"show err":""}" id="admstat">${esc(err||"")}</div></div>
     <p class="anote">${t("admNote")}</p>`;
}

function admStatus(kind, text){
  const el = $id("admstat"); if (!el) return;
  el.className = "astat show " + (kind||""); el.textContent = text;
}

function runIcon(r){
  if (r.status !== "completed") return "⏳";
  return r.conclusion === "success" ? "✅" : "❌";
}
function runsHtml(list){
  if (!list.length) return `<p style="margin:0">${t("admNoRuns")}</p>`;
  return `<table class="runs">` + list.map(r =>
    `<tr><td>${runIcon(r)}</td><td>${esc((r.created_at||"").replace("T"," ").slice(0,16))}</td><td>${esc(r.event === "workflow_dispatch" ? "TEST" : r.event)}</td>
     <td style="text-align:right"><a href="${esc(r.html_url)}" target="_blank" rel="noopener noreferrer" style="color:var(--purple);font-weight:600">${t("admOpen")}</a></td></tr>`).join("") + `</table>`;
}
async function fetchRuns(n){
  const r = await ghApi(`/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=${n}`);
  if (!r.ok) return null;
  return (await r.json()).workflow_runs || [];
}
async function loadRuns(){
  const el = $id("admruns"); if (!el) return;
  const list = await fetchRuns(5);
  el.innerHTML = list ? runsHtml(list) : `<p style="margin:0">–</p>`;
}

async function sendTest(){
  const title = $id("admt").value.trim(), body = $id("admb").value, pre = $id("admp").checked;
  if (!title) { admStatus("err", t("admNeedTitle")); return; }
  const btn = $id("admsend"); btn.disabled = true;
  const started = Date.now();
  try {
    const r = await ghApi(`/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ref: adm.branch, inputs:{title, body, prerelease: String(pre)}})});
    if (r.status !== 204) {
      let m = ""; try { m = (await r.json()).message || ""; } catch(e){}
      const hint = r.status === 404 ? t("admFail404") : r.status === 422 ? t("admFail422") : "";
      admStatus("err", `${t("admFail")} (${r.status}). ${hint} ${m}`.trim());
      return;
    }
    admStatus("", t("admQueued"));
    for (let i = 0; i < 25; i++) {                       // ~75 s
      await sleep(3000);
      const list = await fetchRuns(5);
      if (!list) continue;
      const run = list.find(x => x.event === "workflow_dispatch" && Date.parse(x.created_at) >= started - 60000);
      if (!run) continue;
      if (run.status !== "completed") { admStatus("", t("admRun")); continue; }
      admStatus(run.conclusion === "success" ? "ok" : "err", run.conclusion === "success" ? t("admOk") : t("admRunFail"));
      const el = $id("admruns"); if (el) el.innerHTML = runsHtml(list);
      return;
    }
    admStatus("", t("admRun"));
    loadRuns();
  } catch(e){
    admStatus("err", t("admFail") + ": " + String((e && e.message) || e));
  } finally { btn.disabled = false; }
}

$id("admin").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;

async function getFile(path){
  const r = await ghApi(`/repos/${REPO}/contents/${cpath(path)}?ref=${encodeURIComponent(adm.branch)}`);
  if (r.status === 404) return null;
  if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
  const j = await r.json(); return Array.isArray(j) ? null : j;
}
async function putFile(path, contentB64, message){
  const old = await getFile(path);
  const r = await ghApi(`/repos/${REPO}/contents/${cpath(path)}`, {method:"PUT", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({message, content:contentB64, branch:adm.branch, sha: old ? old.sha : undefined})});
  if (!r.ok) { let m=""; try { m = (await r.json()).message || ""; } catch(e){} const e = new Error(`${r.status} ${m}`.trim()); e.status = r.status; throw e; }
}

/* veľké obrázky sa zmenšia (max 1920 px), aby repozitár nenarastal a stránka sa rýchlo načítala */
async function prepImage(file){
  const extOf = f => ((f.name.match(/\.(png|jpe?g|gif|webp|svg)$/i)||[])[1] || "png").toLowerCase().replace("jpeg","jpg");
  const keep = {blob:file, ext:extOf(file)};
  const m = (file.type||"").match(/^image\/(png|jpeg|webp)$/);
  if (!m || !window.createImageBitmap) return keep;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1920 / bmp.width);
    if (k === 1 && file.size <= 1.5*1024*1024) { bmp.close && bmp.close(); return keep; }
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    const blob = await new Promise(r => c.toBlob(r, m[0], .86));
    if (blob && blob.size < file.size) return {blob, ext: m[1]==="jpeg" ? "jpg" : m[1]};
  } catch(e){}
  return keep;
}
async function uploadImg(file, id, prefix){
  mStatus("", `${tm("mSaving")} ${file.name}`);
  const p = await prepImage(file);
  const base = (slug(file.name.replace(/\.[^.]+$/,"")) || "img").slice(0,40);
  const path = `mods/${id}/${prefix||""}${base}-${Math.random().toString(36).slice(2,6)}.${p.ext}`;
  await putFile(path, await fileB64(p.blob), `Add image ${path}`);
  try { adm.prev[path] = URL.createObjectURL(p.blob); } catch(e){}   // náhľad hneď, kým GitHub Pages nenasadí nový súbor
  return path;
}

const MERGED_BUILTIN = JSON.parse(JSON.stringify(MODS.find(m=>m.id==="tv-radio")||null));
const isTvRadio = m => /tv-?radio/i.test(m.id+" "+m.name);
/* Fabric a NeoForge verzia sú jeden mod s výberom loadera. Staré samostatné karty z mods.json sa zlúčia do jednej. */
function applyMerge(list){
  if (!MERGED_BUILTIN || !list) return list;
  if (!list.some(m => (m.prefixes||[]).length > 1)) {
    const old = list.filter(isTvRadio);
    const fab = old.find(m => !/neoforge/i.test(m.id+" "+m.name));
    const keep = fab || old[0] || {};
    const merged = cleanMod(Object.assign({}, MERGED_BUILTIN, {
      id: keep.id || MERGED_BUILTIN.id,
      gallery: (keep.gallery && keep.gallery.length) ? keep.gallery : MERGED_BUILTIN.gallery,
      readme: Object.assign({}, MERGED_BUILTIN.readme, keep.readme || {}),
      zaloha: (keep.zaloha && keep.zaloha.length) ? keep.zaloha : MERGED_BUILTIN.zaloha
    }));
    const at = old.length ? list.indexOf(old[0]) : list.length;
    for (let k = list.length-1; k >= 0; k--) if (isTvRadio(list[k])) list.splice(k,1);
    list.splice(Math.min(at,list.length), 0, merged);
  }
  list.forEach(m => { if (!m.icon && (m.prefixes||[]).length > 1) m.icon = MERGED_BUILTIN.icon; });
  return list;
}

      <td style="text-align:right"><button class="abtn ghost" data-a="cdel" data-i="${i}"${(used(c.id)||CATS.length<2)?' disabled title="'+esc(tm("cUsed"))+'"':""} aria-label="Delete">✕</button></td></tr>`).join("")}</table>
    <label for="c_name">${tm("cName")}</label><input type="text" id="c_name" maxlength="40" placeholder="🎮 Stardew Valley">
    <label class="chk"><input type="checkbox" id="c_sm"> ${tm("cSm")}</label>
    <div class="arow"><button class="abtn" data-a="cadd">${tm("cAdd")}</button></div><div class="astat" id="cstat"></div></div>`;
}
async function saveCats(list){
  try { await putFile(B.cats, b64(JSON.stringify(list, null, 2) + "\n"), "Update categories"); setCats(list); applyBrandUI(); render(filter); drawMods();
    const s = $id("cstat"); if (s) { s.className = "astat show ok"; s.textContent = tm("cSaved"); } }
  catch(err){ const s = $id("cstat"); if (s) { s.className = "astat show err"; s.textContent = failMsg(err); } }
}
function addCat(){
  const label = $id("c_name").value.trim(), id = slug(plain(label)); if (!label || !id) return;
  if (CATS.some(c => c.id === id)) { const s = $id("cstat"); s.className = "astat show err"; s.textContent = tm("cExists"); return; }
  saveCats(CATS.concat([{id, label, sm:$id("c_sm").checked}]));
}
function delCat(i){
  const c = CATS[i]; if (!c || CATS.length < 2 || adm.mods.some(m => m.game === c.id)) return;
  if (confirm(`${tm("cDelQ")} „${c.label}“?`)) saveCats(CATS.filter((_,k) => k !== i));
}
applyBrandUI();
loadMods().then(loadVersions).then(()=>{ applyBrandUI(); render(filter); route(); });
</script>
</body>
</html>
